<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Una pequeña sorpresa</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
font-family:Georgia,"Times New Roman",serif;
background:radial-gradient(circle at 50% 20%,#fffef2,#fff1a0 48%,#e3b51b);
color:#5b4300;display:flex;align-items:center;justify-content:center
}
.scene{text-align:center;width:100%;padding:20px}
.intro{font:600 19px Arial,sans-serif;color:#715400;margin-bottom:25px}
.envelope{position:relative;width:min(88vw,430px);height:280px;margin:auto}
.env{position:absolute;inset:0;background:#f3d36d;border-radius:12px;box-shadow:0 18px 40px #80600055}
.env:after{content:"";position:absolute;inset:0;clip-path:polygon(0 0,50% 57%,100% 0,100% 100%,0 100%);background:#e3b83d;border-radius:12px}
.flap{position:absolute;z-index:4;top:0;left:0;width:100%;height:155px;background:#ffe58b;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .9s ease}
.letter{position:absolute;z-index:2;left:6%;width:88%;height:225px;bottom:4px;background:#fffdf3;border-radius:9px;border:1px solid #ead58a;box-shadow:0 5px 20px #8060003d;padding:15px;transition:transform .9s ease}
.inner{height:100%;border:1px solid #ead58a;border-radius:7px;display:flex;align-items:center;justify-content:center;padding:20px}
.content{opacity:0;text-align:center}
.date{font:600 11px Arial,sans-serif;letter-spacing:4px;color:#a27a00;margin-bottom:10px}
.rule{width:55px;height:1px;background:#d5ac32;margin:0 auto 14px}
.content h1{font-size:23px;color:#b17d00;margin:0 0 12px}
.content p{font-size:20px;line-height:1.4;margin:0;color:#5c480e}
.signature{margin-top:14px;font-size:14px;font-style:italic;color:#947000}
.seal{position:absolute;z-index:6;left:50%;top:48%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:#d5a600;color:#fff;display:flex;align-items:center;justify-content:center;font-size:27px;box-shadow:0 4px 10px #80600055;transition:opacity .3s}
.open-link{position:absolute;inset:0;z-index:20}
.tap{margin-top:24px;font:14px Arial,sans-serif;color:#806300}

/* Flores: aparecen separadas y ocupan la pantalla, luego desaparecen */
.bloom{
position:fixed;z-index:50;inset:0;pointer-events:none;opacity:0;
}
.flower{position:absolute;font-size:42px;opacity:0}
.f1{left:8%;top:18%}.f2{left:25%;top:10%}.f3{left:47%;top:17%}.f4{left:70%;top:9%}.f5{left:87%;top:23%}
.f6{left:14%;top:52%}.f7{left:35%;top:43%}.f8{left:61%;top:51%}.f9{left:81%;top:46%}
.f10{left:5%;top:78%}.f11{left:27%;top:72%}.f12{left:50%;top:82%}.f13{left:74%;top:75%}.f14{left:91%;top:82%}

#open:target .flap{transform:rotateX(180deg)}
#open:target .letter{transform:translateY(-125px);z-index:60}
#open:target .seal{opacity:0}
#open:target .open-link{display:none}
#open:target .tap{display:none}
#open:target .bloom{animation:bloomScreen 2.7s ease forwards}
#open:target .flower{animation:flowerAppear 2.2s ease forwards}
#open:target .content{animation:messageIn .9s 3.05s ease forwards;position:relative;z-index:70}

@keyframes bloomScreen{
0%,8%{opacity:0} 18%,72%{opacity:1} 100%{opacity:0}
}
@keyframes flowerAppear{
0%{opacity:0;transform:scale(.25) rotate(-15deg)}
25%{opacity:1;transform:scale(1.15) rotate(8deg)}
65%{opacity:1;transform:scale(1) rotate(-4deg)}
100%{opacity:0;transform:scale(.9) translateY(-20px)}
}
@keyframes messageIn{
from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}
}
@media(max-height:650px){
.envelope{height:225px}.letter{height:185px}#open:target .letter{transform:translateY(-95px)}
.flower{font-size:34px}
}
</style>
</head>
<body>
<div class="scene">
<div class="intro">Tengo algo para ti… 💛</div>

<div class="envelope" id="open">
<div class="env"></div>
<div class="letter">
<div class="inner">
<div class="content">
<div class="date">21 · 09 · 2026</div>
<div class="rule"></div>
<h1>Para ti, con cariño 💛</h1>
<p><strong>Arréglate bonito,<br>que hoy quiero pasar<br>una linda velada contigo.</strong></p>
<div class="signature">Una noche especial nos espera ✨</div>
</div>
</div>
</div>
<div class="flap"></div>
<div class="seal">💛</div>

<div class="bloom">
<span class="flower f1">🌻</span><span class="flower f2">🌼</span><span class="flower f3">🌻</span><span class="flower f4">🌼</span><span class="flower f5">🌻</span>
<span class="flower f6">🌼</span><span class="flower f7">🌻</span><span class="flower f8">🌼</span><span class="flower f9">🌻</span>
<span class="flower f10">🌻</span><span class="flower f11">🌼</span><span class="flower f12">🌻</span><span class="flower f13">🌼</span><span class="flower f14">🌻</span>
</div>

<a class="open-link" href="#open" aria-label="Abrir el sobre"></a>
</div>
<div class="tap">Toca el sobre para abrirlo</div>
</div>
</body>
</html>
