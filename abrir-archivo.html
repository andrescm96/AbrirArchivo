.scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,239,190,.10),rgba(227,177,48,.25) 60%,rgba(198,140,22,.45));}

.intro{position:absolute;z-index:4;top:9%;left:8%;right:8%;text-align:center;color:#795606;text-shadow:0 2px 9px #fff2bd99;font-family:"Brush Script MT","Segoe Script",cursive;font-size:clamp(42px,10vw,58px);line-height:.95}
.intro span{display:block;font-size:.82em}
.intro .heart{font-family:Georgia,serif;font-size:32px;margin-top:12px}

.envelope-area{position:absolute;z-index:10;left:8%;right:8%;top:49%;height:230px;max-width:520px;margin:auto;perspective:1000px}
.envelope{position:absolute;inset:0;border-radius:13px;background:#dfaF27;box-shadow:0 18px 35px #5e410055}
.paper{position:absolute;left:6%;right:6%;bottom:4%;height:88%;background:#fffdf6;border-radius:11px}
.front{position:absolute;z-index:6;inset:0;background:#dcae28;clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);border-radius:13px}
.flap{position:absolute;z-index:8;left:0;right:0;top:0;height:67%;background:#ffe28a;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;transition:transform .9s cubic-bezier(.2,.8,.2,1);backface-visibility:hidden}
.seal{position:absolute;z-index:9;left:50%;top:53%;width:62px;height:62px;transform:translate(-50%,-18%);border-radius:50%;background:#cf9d00;color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 5px 14px #5e410066;transition:opacity .3s}
.click-envelope{position:absolute;z-index:30;inset:-5px -5px -78px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tap{position:absolute;z-index:35;left:10%;right:10%;bottom:-72px;height:55px;border-radius:30px;border:1px solid #fff0a0;background:#76500ee8;color:#fff9df;display:flex;align-items:center;justify-content:center;font:700 14px Arial,sans-serif;letter-spacing:1.4px;box-shadow:0 0 22px #fff0a477;pointer-events:none}
.tap::before{content:"☝️";font-size:23px;margin-right:9px}
.note{position:absolute;z-index:35;left:0;right:0;bottom:-99px;text-align:center;color:#745308;font:13px Arial,sans-serif;transition:opacity .3s}

.flowers{position:absolute;inset:0;z-index:50;pointer-events:none;opacity:0;background:radial-gradient(circle at center,#fff9d8aa,transparent 63%)}
.flower{position:absolute;font-size:48px;opacity:0}
.f1{left:5%;top:16%}.f2{left:23%;top:9%}.f3{left:46%;top:15%}.f4{left:70%;top:8%}.f5{left:87%;top:21%}.f6{left:9%;top:48%}.f7{left:34%;top:40%}.f8{left:60%;top:47%}.f9{left:82%;top:42%}.f10{left:4%;top:76%}.f11{left:27%;top:70%}.f12{left:50%;top:80%}.f13{left:73%;top:71%}.f14{left:90%;top:79%}

.final-bg{position:absolute;inset:0;z-index:20;opacity:0;background:radial-gradient(circle at 50% 12%,#fffef5 0%,#fff0a9 48%,#e5b72f 100%);pointer-events:none}
.letter{position:absolute;z-index:80;left:6%;right:6%;top:50%;max-width:560px;margin:auto;padding:13px;background:#fffdf6;border:1px solid #dfc36c;border-radius:18px;box-shadow:0 18px 55px #62450055;transform:translateY(-50%) scale(.94);opacity:0;pointer-events:none}
.inner{border:1px solid #e1c66d;border-radius:12px;padding:29px 19px 25px;text-align:center}
.date{font:600 12px Arial,sans-serif;letter-spacing:5px;color:#9d7608;margin-bottom:13px}
.rule{width:60px;height:1px;background:#d4ac3f;margin:0 auto 14px}
.letter h1{margin:0 0 12px;font-family:"Brush Script MT","Segoe Script",cursive;font-size:48px;font-weight:400;color:#ae7900;line-height:1.05}
.letter-heart{font-size:29px;margin-bottom:12px}
.message{font-size:25px;line-height:1.28;font-weight:600;color:#594510;margin:0}
.signature{margin-top:21px;font-family:"Brush Script MT","Segoe Script",cursive;font-size:29px;color:#987000}
.end{margin-top:11px;font-size:20px}

#state:checked ~ .scene .flap{transform:rotateX(180deg)}
#state:checked ~ .scene .seal{opacity:0}
#state:checked ~ .scene .tap,#state:checked ~ .scene .note{opacity:0}
#state:checked ~ .scene .intro{animation:introOut .6s .1s forwards}
#state:checked ~ .scene .envelope-area{animation:envOut .7s 1.75s forwards}
#state:checked ~ .scene .flowers{animation:flowersIn 2.8s .9s forwards}
#state:checked ~ .scene .flower{animation:flower 2.3s .9s forwards}
#state:checked ~ .scene .final-bg{animation:finalIn .8s 3.45s forwards}
#state:checked ~ .scene .letter{animation:letterIn .9s 3.55s forwards}

@keyframes introOut{to{opacity:0;transform:translateY(-15px)}}
@keyframes envOut{to{opacity:0;transform:translateY(18px)}}
@keyframes flowersIn{0%,8%{opacity:0}18%,70%{opacity:1}100%{opacity:0}}
@keyframes flower{0%{opacity:0;transform:scale(.2) rotate(-18deg)}25%{opacity:1;transform:scale(1.12) rotate(8deg)}65%{opacity:1;transform:scale(1) rotate(-5deg)}100%{opacity:0;transform:scale(.9) translateY(-25px)}}
@keyframes finalIn{from{opacity:0}to{opacity:1}}
@keyframes letterIn{from{opacity:0;transform:translateY(-47%) scale(.94)}to{opacity:1;transform:translateY(-50%) scale(1)}}

@media(max-height:720px){.intro{top:7%;font-size:42px}.envelope-area{top:45%;height:210px}.tap{bottom:-68px;height:51px}.note{bottom:-94px}.inner{padding:24px 16px 20px}.letter h1{font-size:42px}.message{font-size:22px}.signature{font-size:25px}}
</style>
</head>

<input id="state" type="checkbox">
<div class="scene">
  <div class="intro">Tengo algo<span>para ti...</span><div class="heart">♡</div></div>

    <div class="envelope"><div class="paper"></div><div class="front"></div><div class="flap"></div><div class="seal">💛</div></div>
    <label class="click-envelope" for="state" aria-label="Toca para abrir"></label>
    <div class="tap">TOCA PARA ABRIRLO</div>
    <div class="note">Una pequeña sorpresa para ti ✨</div>
  </div>

  <div class="flowers">
    <div class="flower f1">🌻</div><div class="flower f2">🌻</div><div class="flower f3">🌻</div><div class="flower f4">🌻</div><div class="flower f5">🌻</div>
    <div class="flower f6">🌻</div><div class="flower f7">🌻</div><div class="flower f8">🌻</div><div class="flower f9">🌻</div><div class="flower f10">🌻</div>
    <div class="flower f11">🌻</div><div class="flower f12">🌻</div><div class="flower f13">🌻</div><div class="flower f14">🌻</div>
  </div>

  <div class="final-bg"></div>
